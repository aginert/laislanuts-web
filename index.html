<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Isla Nuts — Próximamente</title>
<meta name="description" content="La Isla Nuts — frutos secos de origen seleccionado, tostados artesanalmente en Tenerife. Muy pronto. Suscríbete para enterarte del lanzamiento.">
<meta property="og:title" content="La Isla Nuts — Próximamente">
<meta property="og:description" content="Frutos secos de origen seleccionado, tostados artesanalmente en Tenerife. Muy pronto.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://laislanuts.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23EFEBE3' stroke='%239B5E3A' stroke-width='2'/%3E%3Ctext x='16' y='21' font-family='Georgia,serif' font-size='11' letter-spacing='0.5' text-anchor='middle' fill='%2317241C'%3ELN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;1,300&family=Barlow+Condensed:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--cream:#EFEBE3;--green:#17241C;--green-soft:#3B4A40;--copper:#9B5E3A;--muted:#7A7568;--line:#D9D1C4;}
  html,body{height:100%;}
  body{height:100dvh;overflow:hidden;background:
      radial-gradient(ellipse at 50% 6%,rgba(155,94,58,0.08) 0%,transparent 55%),var(--cream);
    color:var(--green);font-family:'Barlow',sans-serif;font-weight:300;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;}
  .stage{text-align:center;padding:22px;display:flex;flex-direction:column;align-items:center;max-width:560px;}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--copper);color:var(--cream);
    padding:7px 17px;border-radius:100px;font-family:'Barlow Condensed',sans-serif;font-weight:500;
    font-size:0.62rem;letter-spacing:0.3em;text-transform:uppercase;animation:fade .8s .1s both;margin-bottom:14px;}
  .chip .dot{width:5px;height:5px;border-radius:50%;background:var(--cream);animation:blink 2s infinite;}
  .emblem{position:relative;animation:pop 1.1s cubic-bezier(.2,.8,.2,1) both;}
  .emblem::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:64%;height:64%;border-radius:50%;background:radial-gradient(circle,rgba(155,94,58,0.12) 0%,transparent 70%);}
  .emblem svg{position:relative;width:clamp(190px,32vh,260px);height:clamp(190px,32vh,260px);display:block;}
  .emblem .rot{transform-origin:center;animation:spin 55s linear infinite;}
  .slogan{font-style:italic;font-size:clamp(0.95rem,1.9vw,1.1rem);line-height:1.6;color:var(--green-soft);max-width:400px;margin:16px 0 2px;animation:fade 1s .5s both;}
  form{margin-top:16px;width:100%;max-width:410px;display:flex;flex-direction:column;gap:10px;animation:fade 1s .65s both;}
  .nl-text{width:100%;background:#fff;border:1px solid var(--line);padding:13px 18px;font-family:'Barlow',sans-serif;font-size:0.85rem;color:var(--green);outline:none;text-align:center;transition:border-color .3s;}
  .nl-text::placeholder{color:var(--muted);}
  .nl-text:focus{border-color:var(--copper);}
  .row{display:flex;box-shadow:0 6px 22px rgba(23,36,28,0.06);}
  .row .nl-text{flex:1;border-right:none;text-align:left;box-shadow:none;}
  button{background:var(--copper);border:1px solid var(--copper);color:var(--cream);padding:13px 24px;font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:0.72rem;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:background .3s;white-space:nowrap;}
  button:hover{background:var(--green);border-color:var(--green);}
  button:disabled{opacity:.5;cursor:default;}
  .consent{display:flex;align-items:center;gap:8px;justify-content:center;font-size:0.68rem;color:var(--muted);line-height:1.4;}
  .consent input{accent-color:var(--copper);flex-shrink:0;}
  .consent a{color:var(--copper);}
  .gracias{display:none;color:var(--copper);font-style:italic;padding:14px;font-size:1.05rem;animation:fade .6s both;}
  .foot{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);}
  .foot a{color:var(--muted);text-decoration:none;margin:0 6px;transition:color .3s;}
  .foot a:hover{color:var(--copper);}
  @keyframes fade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  @keyframes pop{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:scale(1);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
  @media(max-width:600px){
    body{height:auto;min-height:100dvh;overflow:auto;padding:6vh 0;}
    .row{flex-direction:column;box-shadow:none;}
    .row .nl-text{border-right:1px solid var(--line);text-align:center;}
  }
  @media(prefers-reduced-motion:reduce){.emblem .rot{animation:none;}.chip .dot{animation:none;}}
</style>
</head>
<body>
  <div class="stage">
    <div class="chip"><span class="dot"></span> Próximamente</div>
    <div class="emblem">
      <svg viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="La Isla Nuts">
        <circle cx="120" cy="120" r="112" stroke="#9B5E3A" stroke-width="1" opacity="0.55"/>
        <circle cx="120" cy="120" r="103" stroke="#9B5E3A" stroke-width="0.5" opacity="0.28"/>
        <g class="rot">
          <path id="top" d="M 40,120 A 80,80 0 0,1 200,120" fill="none"/>
          <path id="bot" d="M 200,120 A 80,80 0 0,1 40,120" fill="none"/>
          <text font-family="Barlow Condensed, sans-serif" font-size="8" font-weight="400" letter-spacing="4.5" fill="#9B5E3A" opacity="0.4">
            <textPath href="#top" startOffset="7%">TOSTADO ARTESANAL · ORIGEN SELECCIONADO</textPath>
          </text>
          <text font-family="Barlow Condensed, sans-serif" font-size="8" font-weight="400" letter-spacing="5.5" fill="#9B5E3A" opacity="0.4">
            <textPath href="#bot" startOffset="26%">TENERIFE · CANARIAS</textPath>
          </text>
        </g>
        <text x="120" y="114" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="31" font-weight="400" letter-spacing="4" fill="#17241C">LA ISLA</text>
        <line x1="90" y1="127" x2="150" y2="127" stroke="#9B5E3A" stroke-width="0.9"/>
        <text x="120" y="148" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-size="16" font-weight="500" letter-spacing="7" fill="#9B5E3A">NUTS</text>
      </svg>
    </div>
    <p class="slogan">Frutos secos de origen seleccionado, tostados con el cuidado que merece cada pieza.</p>
    <form id="newsletter-form">
      <input type="text" name="nombre" class="nl-text" placeholder="Tu nombre (opcional)" aria-label="Tu nombre">
      <div class="row">
        <input type="email" name="email" class="nl-text" placeholder="Tu correo electrónico" required aria-label="Tu correo electrónico">
        <button type="submit">Avísame</button>
      </div>
      <label class="consent"><input type="checkbox" name="consent" required> Acepto la <a href="/privacidad.html" target="_blank" rel="noopener">política de privacidad</a></label>
    </form>
    <p class="gracias">Gracias. Te avisaremos.</p>
  </div>
  <div class="foot"><a href="/aviso-legal.html">Aviso Legal</a> · <a href="/privacidad.html">Política de Privacidad</a> · &copy; 2026 La Isla Nuts</div>
  <script>
    (function () {
      var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0kUx2583AQZpAg6x0baSdlqjkCxz2MadqTEnPkVukGpeRdFsdlSVGh0vDbnXiOk97wg/exec';
      var form = document.getElementById('newsletter-form');
      var gracias = document.querySelector('.gracias');
      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        var email = form.querySelector('input[name="email"]').value.trim();
        var nombre = form.querySelector('input[name="nombre"]').value.trim();
        var consent = form.querySelector('input[name="consent"]').checked;
        if (!email) return;
        if (!consent) { alert('Debes aceptar la política de privacidad para suscribirte.'); return; }
        var btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Enviando...';
        var origen = document.referrer || (window.location.search ? window.location.search.slice(1) : 'directo');
        var body = new URLSearchParams();
        body.append('email', email);
        body.append('nombre', nombre);
        body.append('consentimiento', 'Sí — política de privacidad');
        body.append('origen', origen);
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: body })
          .then(function () { form.style.display = 'none'; gracias.style.display = 'block'; })
          .catch(function () { btn.disabled = false; btn.textContent = 'Avísame'; alert('Hubo un problema al enviar. Inténtalo de nuevo.'); });
      });
    })();
  </script>
</body>
</html>
